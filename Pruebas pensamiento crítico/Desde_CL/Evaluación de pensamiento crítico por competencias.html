</style></head><body><main>
<section id="sel" class="sheet">
<h1>Evalúa tu pensamiento crítico</h1>
<p>Elige la competencia que quieres evaluar. Cada cuestionario tiene 20 preguntas con retroalimentación inmediata y un perfil final por habilidad. Puedes hacer los cuatro y volver a intentarlos.</p>

</section>

</section>

</section>

<script>
const QZ={};
QZ.m=(()=>{
const D={I:"Interpretación",A:"Análisis",E:"Evaluación",N:"Inferencia",X:"Explicación",R:"Autorregulación"};
const DS={I:"leer gráficos y cifras sin dejarte engañar por su presentación",A:"descomponer problemas y argumentos e identificar datos faltantes o fallos lógicos",E:"juzgar la solidez de la evidencia, las muestras y las demostraciones",N:"sacar conclusiones justificadas y evitar sesgos probabilísticos",X:"justificar resultados y refutar afirmaciones con razones válidas",R:"verificar la razonabilidad de tus resultados y contrastar tu trabajo"};
const TIP={I:"Antes de concluir, pregunta qué mide cada cifra, desde dónde parte el eje y si la comparación es absoluta o relativa.",A:"Ante un problema, lista primero datos, incógnitas y supuestos; ante un argumento, separa premisas de conclusión.",E:"Pregunta siempre quién compone la muestra, cuántos casos hay y si ejemplos bastan para demostrar algo.",N:"Distingue lo que los datos permiten afirmar de lo que solo sugieren; revisa tasas base e independencia.",X:"Practica justificar con demostraciones breves y buscando contraejemplos.",R:"Haz del chequeo un hábito: estima el orden de magnitud, prueba casos simples y contrasta métodos."};
/* [dimensión, pregunta, opciones (la correcta va primero), retroalimentación] */
const Q=[
["I","Un gráfico de barras muestra ventas de 100 y 105, pero el eje vertical empieza en 98, así que la segunda barra parece el triple de alta. ¿Cuál es la lectura más crítica?",["El eje truncado exagera visualmente un aumento real de solo 5 %","Las ventas se triplicaron","El gráfico es correcto porque las barras son exactas","No se puede concluir nada de un gráfico"],"Si el eje no parte de cero, la altura de las barras deja de ser proporcional al valor. El crecimiento real es 5/100 = 5 %."],
["I","En el primer parcial aprobó el 40 % del grupo y en el segundo el 50 %. Un titular dice: “La aprobación mejoró un 10 %”. ¿Qué afirmación es más precisa?",["Subió 10 puntos porcentuales, un aumento relativo del 25 %","Subió exactamente un 10 %","Subió un 50 %","Subió un 4 %"],"La diferencia absoluta es de 10 puntos porcentuales; la relativa es 10/40 = 25 %. Confundirlas es un error muy frecuente."],
["I","Cuatro empleados ganan 1 millón y el gerente gana 16 millones. El informe dice: “El salario promedio es de 4 millones”. ¿Qué es lo más acertado?",["El promedio es correcto, pero poco representativo; la mediana (1 millón) describe mejor al empleado típico","El informe es falso porque nadie gana 4 millones","El promedio siempre es la mejor medida del centro","La mediana también es 4 millones"],"(4·1 + 16)/5 = 4, pero un valor extremo desplaza la media. Con datos asimétricos conviene reportar también la mediana."],
["I","En los meses con más ventas de helados también hay más casos de ahogamientos. ¿Qué conclusión es más razonable?",["Hay correlación, probablemente explicada por una tercera variable (el calor); no prueba causalidad","Los helados causan ahogamientos","Los ahogamientos aumentan las ventas de helados","No existe ninguna relación entre las variables"],"Correlación no implica causalidad: una variable de confusión (la temperatura) puede explicar ambos fenómenos."],
["A","Un producto sube su precio un 20 % y luego se le aplica un descuento del 20 %. Comparado con el precio original, el precio final es:",["4 % menor","Igual","4 % mayor","20 % menor"],"Los porcentajes se aplican sobre bases distintas: 1,2 × 0,8 = 0,96, es decir, un 4 % menos."],
["A","Un tren sale de A a 60 km/h y otro sale de B a 90 km/h. Se pregunta en cuánto tiempo se encuentran. ¿Qué debe hacer primero un pensador crítico?",["Identificar qué datos faltan (distancia entre A y B y sentido de marcha) antes de calcular","Sumar las velocidades y dividir entre 2","Multiplicar 60 × 90","Suponer que el tiempo es de 1 hora"],"Sin la distancia inicial y el sentido de los movimientos el problema no tiene solución única. Analizar antes de operar evita cálculos vacíos."],
["A","Afirmación: “Todo número primo es impar”. ¿Qué basta para demostrar que es falsa?",["Un contraejemplo: el 2 es primo y es par","Comprobar que 3, 5 y 7 son impares","Encontrar muchos primos impares","Notar que la mayoría de los primos son impares"],"Para refutar una afirmación universal basta un solo contraejemplo. Los casos que la cumplen no la demuestran ni la refutan."],
["A","Premisa: “Si llueve, el suelo se moja”. Observación: “El suelo está mojado”. Conclusión: “Entonces llovió”. Este razonamiento es:",["Inválido: afirma el consecuente; el suelo pudo mojarse por otra causa","Válido (modus ponens)","Válido (modus tollens)","Inválido porque la premisa es falsa"],"De “si P entonces Q” y Q no se puede concluir P. Es la falacia de afirmar el consecuente."],
["E","Una prueba detecta al 99 % de los enfermos y da negativo al 99 % de los sanos. La enfermedad afecta a 1 de cada 1000 personas. Si alguien da positivo, la probabilidad aproximada de que esté enfermo es:",["Cerca del 9 %","99 %","50 %","1 %"],"En 100 000 personas hay 100 enfermos (99 positivos) y 99 900 sanos (999 falsos positivos): 99/(99 + 999) ≈ 9 %. Ignorar la tasa base es un sesgo clásico."],
["E","Para estimar la intención de voto nacional, una encuesta en línea recoge 1 000 respuestas entre los seguidores de un candidato. ¿Cuál es la crítica más sólida?",["La muestra tiene sesgo de selección y no representa a la población","1 000 es siempre un tamaño demasiado pequeño","Las encuestas en línea nunca son válidas","No hay problema porque hay muchas respuestas"],"Importa más cómo se elige la muestra que su tamaño: una muestra sesgada no se corrige con más datos."],
["E","Un estudiante comprueba que n² + n + 41 es primo para n = 1, 2, …, 30 y concluye que lo es para todo n. ¿Cómo se evalúa este argumento?",["No es una prueba: verificar casos no demuestra una afirmación general (falla con n = 40)","Es válido porque se probaron 30 casos","Es válido solo si se prueban 100 casos","No es válido porque 41 no es primo"],"Para n = 40: 1600 + 40 + 41 = 1681 = 41². Muchos ejemplos pueden sugerir una regla, pero no la demuestran."],
["E","Un anuncio dice: “Este suplemento reduce el riesgo de infarto en un 50 %”. El estudio mostró que el riesgo pasó de 2 en 10 000 a 1 en 10 000. ¿Qué evaluación es más adecuada?",["La reducción relativa es del 50 %, pero la absoluta es de solo 0,01 puntos porcentuales; el anuncio magnifica el efecto","El anuncio es falso: no hay reducción","El efecto es enorme porque 50 % es mucho","No se puede calcular ninguna reducción"],"Pasar de 2 a 1 en 10 000 es una reducción relativa del 50 % y una absoluta de 0,01 %. Pide siempre ambas cifras."],
["N","Una moneda justa cayó cara cinco veces seguidas. ¿Cuál es la probabilidad de que el siguiente lanzamiento sea sello?",["50 %: los lanzamientos son independientes","Mayor al 50 %, porque toca compensar","Menor al 50 %, porque la moneda está en racha","(1/2)⁶ ≈ 1,6 %"],"La moneda no tiene memoria. Creer que “toca” sello es la falacia del jugador; el 1,6 % es la probabilidad de la secuencia completa, no la del siguiente lanzamiento."],
["N","Se muestra la secuencia 1, 2, 4, 8, 16, … y se pide el siguiente término. ¿Qué inferencia es más rigurosa?",["Con esos datos no es único: 32 es plausible, pero otras reglas dan 31 (regiones de un círculo con puntos)","Es 32, sin ninguna duda","Es 24, porque se suma 8","No existe ningún patrón"],"Una lista finita de términos es compatible con infinitas reglas. Lo prudente es declarar la regla supuesta y su justificación."],
["N","Cada cliente que entra a una tienda compra con probabilidad del 40 %, de forma independiente. Si entran 3 clientes, la probabilidad de que al menos uno compre es:",["78,4 %","120 %","40 %","21,6 %"],"Se calcula por el complemento: 1 − 0,6³ = 1 − 0,216 = 0,784. Sumar 3 × 40 % da 120 %, un valor imposible que delata el error."],
["N","Un trayecto de ida se recorre a 60 km/h y el de vuelta, por la misma ruta, a 40 km/h. La velocidad media del recorrido completo es:",["48 km/h","50 km/h","45 km/h","100 km/h"],"Con distancia d por tramo: tiempo total = d/60 + d/40 = d/24, y 2d ÷ (d/24) = 48 km/h. Promediar velocidades ignora que se pasa más tiempo en el tramo lento."],
["X","¿Cuál es la mejor justificación de que 0,999… = 1?",["Sea x = 0,999…; entonces 10x = 9,999…; al restar, 9x = 9 y x = 1","La calculadora lo redondea a 1","Está muy cerca de 1","Todos los profesores lo afirman"],"Una buena justificación se apoya en pasos lógicos verificables, no en la autoridad, la aproximación ni una herramienta."],
["X","Un compañero afirma que (a + b)² = a² + b² para cualesquiera números. ¿Cuál es la mejor forma de refutarlo?",["Con un contraejemplo: si a = b = 1, el lado izquierdo es 4 y el derecho es 2","Decirle que los libros dicen lo contrario","Probar con a = 0 y b = 3, que sí cumple la igualdad","Insistir hasta que se convenza"],"Un contraejemplo concreto refuta una afirmación general. Un caso que la cumple (a = 0) no prueba nada."],
["R","Al resolver un problema de edades obtienes que la edad de una persona es −5 años. ¿Qué haces?",["Reviso el planteamiento y el procedimiento, porque el resultado no es razonable en el contexto","Lo entrego: el procedimiento fue correcto","Cambio el signo para que sea 5","Borro el problema"],"Un resultado matemático debe interpretarse en su contexto. Una edad negativa es señal de un error en el modelo o en el cálculo."],
["R","Tu resultado difiere del de un compañero. ¿Cuál es la mejor reacción?",["Comparar procedimientos y verificar ambos con un caso simple o con otro método","Asumir que mi resultado es el correcto","Adoptar el suyo porque parece más seguro","Promediar ambos resultados"],"La seguridad no es evidencia. Contrastar métodos y probar casos simples permite detectar el error, sea de quien sea."]
];

return {D,DS,TIP,Q};})();
Object.assign(QZ.m,{name:"Pensamiento crítico matemático",ital:false,intro:"<h1>¿Piensas con rigor matemático?</h1>\n<p>20 preguntas para evaluar tu pensamiento crítico aplicado a las matemáticas: leer datos con cuidado, analizar argumentos, evaluar evidencia, inferir con prudencia, justificar y revisar tu propio trabajo.</p>\n<p class=\"mu\">Recibes retroalimentación después de cada respuesta y, al final, un perfil por habilidad. Puedes usar lápiz y papel; no necesitas calculadora. Las preguntas y las opciones cambian de orden en cada intento.</p>",ok:"¡Buen razonamiento!",ko:"Revisemos este razonamiento",title:"Tu perfil de pensamiento crítico",s1:"Tienes fortaleza en todas las dimensiones.",s2:"Prueba a explicar tus razonamientos a otra persona para consolidarlos.",LV:s=>{const lv=s>=17?["Pensador crítico avanzado","Evalúas con rigor, detectas falacias y justificas tus conclusiones. Tu reto es sostener ese nivel en problemas nuevos y poco estructurados."]:s>=13?["Pensador crítico competente","Razonas bien en la mayoría de los casos, aunque algunos sesgos o atajos aún se te escapan. Afinar las dimensiones más débiles te llevará al nivel avanzado."]:s>=9?["Pensamiento crítico en desarrollo","Tienes bases sólidas, pero a veces aceptas cifras o argumentos sin cuestionarlos. Con práctica deliberada en las dimensiones señaladas puedes avanzar rápido."]:["Pensamiento crítico inicial","Es un buen punto de partida: ahora sabes en qué cuestionar más. Revisa la retroalimentación y vuelve a intentarlo."]; return lv;}});
QZ.l=(()=>{
const D={I:"Interpretación",A:"Análisis",E:"Evaluación",N:"Inferencia",C:"Contextualización",R:"Autorregulación"};
const DS={I:"captar el sentido, la idea central y el tono de un texto, más allá de su literalidad",A:"identificar premisas, conclusiones, supuestos y la función de cada parte del argumento",E:"juzgar la calidad de las fuentes, la evidencia y la solidez del razonamiento, y detectar falacias",N:"deducir lo implícito y sacar conclusiones que el texto realmente permite",C:"reconocer la intención, la perspectiva y el lenguaje valorativo de quien escribe",R:"monitorear tu propia comprensión y tus sesgos como lector"};
const TIP={I:"Antes de responder, parafrasea el pasaje con tus palabras y distingue lo literal de lo figurado o irónico.",A:"Subraya la conclusión y pregunta: ¿qué premisas la sostienen y qué supuestos callan?",E:"Ante cada afirmación pregunta quién la dice, con qué evidencia, con qué interés y qué falacia podría contener.",N:"Diferencia lo que el texto afirma, lo que sugiere y lo que tú añades; no conviertas asociación en causa.",C:"Observa el medio, el autor, el público al que se dirige y las palabras con carga emocional.",R:"Hazte el hábito de resumir lo leído y de aplicar el mismo rigor a lo que confirma y a lo que contradice tus ideas."};
/* [dimensión, fragmento, pregunta, opciones (la correcta va primero), retroalimentación] */
const Q=[
["I","“La ciudad no perdió su río; lo olvidó bajo el cemento, y el olvido, como el agua, siempre encuentra por dónde volver.”","¿Qué sugiere el autor con esta frase?",["Que la naturaleza ocultada tarde o temprano reclama su espacio, por ejemplo con inundaciones","Que el río desapareció físicamente","Que el cemento es un material impermeable","Que la ciudad sufre una sequía"],"La frase es figurada: el “olvido” que “encuentra por dónde volver” alude a lo ocultado que reaparece. Leerla de forma literal desvía el sentido."],
["I","“El informe no dice que el programa haya fracasado; señala que sus metas, tal como se formularon, no eran medibles.”","¿Cuál es la idea central del fragmento?",["Que el programa no puede evaluarse bien porque sus metas eran imprecisas, lo que no equivale a decir que fracasó","Que el programa fracasó","Que el programa cumplió todas sus metas","Que el informe no tiene conclusiones"],"El texto distingue entre “fracasar” y “no poder medirse”. Captar esa distinción es parte de interpretar con precisión."],
["I","“Claro, porque subir el precio del transporte por tercera vez este año es una muestra de enorme sensibilidad hacia los usuarios.”","¿Qué intención comunica el autor?",["Ironía: critica el alza diciendo lo contrario de lo que piensa","Elogia sinceramente la medida","Informa neutralmente sobre el precio","Pregunta cuántas veces subió el pasaje"],"Cuando lo dicho choca con el contexto (alzas repetidas = “sensibilidad”), hay ironía. El tono es parte del significado."],
["I","“Entre 2015 y 2020 la deserción pasó del 12 % al 9 %; en el mismo lapso la matrícula creció un 30 %.”","¿Qué enunciado se desprende del texto sin añadir nada?",["La deserción bajó 3 puntos porcentuales y la matrícula creció en el mismo periodo, sin que el texto indique una causa","La deserción bajó porque la matrícula creció","La deserción se redujo en un 3 %","El programa de apoyo redujo la deserción"],"El texto presenta dos datos simultáneos, no una relación causal. Además, 12 % → 9 % son 3 puntos porcentuales (una caída relativa del 25 %)."],
["A","“Los estudiantes que leen más obtienen mejores notas. Por eso, hay que obligar a todos a leer una hora diaria.”","¿Qué supuesto no expresado sostiene este argumento?",["Que leer más causa las mejores notas y que obligar a leer producirá el mismo efecto","Que todos los estudiantes disfrutan leer","Que una hora es el tiempo ideal de lectura","Que las notas miden toda la inteligencia"],"El argumento pasa de una asociación (leen más y tienen mejores notas) a una causa y a una política. Esos saltos son supuestos que conviene examinar."],
["A","“Aunque la medida reduce costos, perjudica a los trabajadores; por tanto, debe rechazarse.”","¿Cuál es la conclusión del argumento?",["La medida debe rechazarse","La medida reduce costos","La medida perjudica a los trabajadores","Los trabajadores reducen costos"],"La conclusión suele marcarse con conectores como “por tanto”. “Aunque…” introduce una concesión, y la premisa decisiva es el perjuicio a los trabajadores."],
["A","“Algunos sostienen que el teletrabajo reduce la productividad. Sin embargo, tres estudios recientes muestran lo contrario.”","¿Qué función cumple la primera oración?",["Presentar una postura contraria para rebatirla (contraargumento)","Expresar la tesis del autor","Aportar la evidencia principal","Concluir el texto"],"El conector “Sin embargo” revela que la primera oración es la posición que el autor discute, no la que defiende."],
["A","“Si un texto fuera confiable, citaría sus fuentes. Este texto no cita fuentes. Por lo tanto, no es confiable.”","¿Qué es lo más cuestionable de este razonamiento?",["La primera premisa: hay textos confiables que no citan formalmente sus fuentes","La forma lógica, que es inválida","Que el texto sea breve","Que use la palabra “confiable”"],"La forma es válida (si P entonces Q; no Q), pero la conclusión solo es sólida si las premisas son verdaderas. Aquí la primera premisa es discutible."],
["E","“La crema se anuncia con el aval de ‘el 95 % de los usuarios satisfechos’, dato de una encuesta hecha por la marca entre quienes compraron dos o más veces.”","¿Cuál es la crítica más sólida a esta evidencia?",["Solo se consultó a quienes ya repitieron la compra (sesgo de selección) y la fuente tiene interés comercial","El porcentaje es demasiado alto para ser verdad","Las encuestas nunca prueban nada","Debió preguntarse a más de 100 personas, sin importar quiénes"],"Quien compra de nuevo probablemente quedó satisfecho: se excluye a los insatisfechos. Además, la marca es parte interesada."],
["E","“No debemos aceptar su propuesta de reforma tributaria; recuerden que él mismo evadió impuestos en 2010.”","¿Qué falacia contiene el argumento?",["Ad hominem: ataca a la persona en lugar de evaluar la propuesta","Pendiente resbaladiza","Falsa dicotomía","Apelación a la autoridad"],"El comportamiento pasado del proponente no demuestra que su propuesta sea mala. La propuesta debe evaluarse por sus méritos."],
["E","“Si permitimos la calculadora en el examen, mañana pedirán que nadie estudie y la universidad perderá su sentido.”","¿Qué falacia se observa?",["Pendiente resbaladiza: anticipa una cadena de consecuencias extremas sin evidencia","Ad hominem","Apelación a la mayoría","Generalización apresurada a partir de un caso"],"Se pasa de un cambio menor a un desenlace catastrófico sin justificar los pasos intermedios."],
["E","“Un estudio con 12 personas, financiado por el fabricante de la bebida, halló que esta mejora la concentración.”","¿Qué crítica es más pertinente?",["La muestra pequeña y el conflicto de interés limitan la confianza y la generalización","El estudio es inválido por ser financiado, sin excepción","Doce personas es un tamaño ideal","Que la bebida sea de un fabricante conocido"],"Una muestra pequeña ofrece resultados inestables, y la financiación por la parte interesada exige cautela y réplica independiente."],
["N","“La mayoría de las tiendas del barrio cerraron después de que abriera el centro comercial.”","¿Qué inferencia está justificada?",["Que los cierres ocurrieron después de la apertura; el texto no establece que esta fuera la causa","Que el centro comercial causó los cierres","Que el barrio quedó sin comercio","Que las tiendas eran de mala calidad"],"“Después de” no es “a causa de”. Faltan datos para descartar otras explicaciones (costos, ventas en línea, cambios del barrio)."],
["N","“Aunque el director prometió transparencia, las actas de las reuniones siguen sin publicarse.”","¿Qué sugiere el texto sin decirlo?",["Que la promesa de transparencia no se ha cumplido","Que el director renunció","Que las reuniones no existen","Que las actas son secretas por ley"],"El conector “aunque” contrapone la promesa con la realidad; la inferencia razonable es el incumplimiento, no hechos nuevos."],
["N","“El médico explicó que el tratamiento ‘puede’ reducir los síntomas en algunos pacientes.”","¿Qué conclusión es la más acertada?",["Existe un beneficio posible, pero no garantizado ni universal","El tratamiento cura a todos","El tratamiento no sirve","Todos los pacientes mejorarán"],"Las palabras “puede” y “algunos” delimitan el alcance. Leer con atención los modalizadores evita sobreinterpretar."],
["N","“Ninguna de las propuestas del comité fue aprobada. Algunas de ellas eran de Marta.”","¿Qué conclusión se deduce con certeza?",["Al menos una propuesta de Marta presentada al comité no fue aprobada","Todas las propuestas de Marta fueron rechazadas","Marta dejó el comité","El comité rechazó las propuestas por ser de Marta"],"Solo sabemos que las propuestas de Marta incluidas entre las del comité no pasaron. El texto no dice nada sobre otras propuestas ni sobre los motivos."],
["C","Versión A: “Los manifestantes ocuparon la plaza.” Versión B: “Los manifestantes arrasaron la plaza.”","¿Qué revela la elección del verbo en la versión B?",["Una postura valorativa del autor mediante lenguaje cargado","Que la descripción es más objetiva","Que la plaza estaba vacía","Que ambas versiones son equivalentes"],"“Arrasar” añade una valoración de destrucción que “ocupar” no tiene. El lenguaje cargado orienta al lector sin declararlo."],
["C","Un artículo sobre los beneficios de cierta dieta aparece en el blog de una empresa que vende suplementos para esa dieta.","¿Qué pregunta es más útil para leerlo críticamente?",["¿Quién lo escribe, qué interés tiene y qué evidencia independiente presenta?","¿Cuántas palabras tiene?","¿Está bien diseñado el blog?","¿Cuántos lectores lo han compartido?"],"Conocer la autoría, el interés y la evidencia permite ponderar el texto; la popularidad o el diseño no garantizan fiabilidad."],
["R","Terminas de leer un artículo y notas que no podrías resumir su tesis en dos frases.","¿Qué haces?",["Releo identificando la tesis y los argumentos, y parafraseo cada párrafo","Sigo adelante: ya lo leí","Memorizo las frases más llamativas","Me quedo solo con el titular"],"Notar que no comprendiste es el primer paso de la autorregulación. Releer con una estrategia es mejor que seguir sin entender."],
["R","Un artículo confirma exactamente lo que ya pensabas.","¿Cuál es la actitud más crítica?",["Aplicarle el mismo rigor que a uno que me contradice: revisar fuentes y evidencias","Aceptarlo porque coincide con mi opinión","Compartirlo de inmediato","Descartar cualquier crítica a su contenido"],"El sesgo de confirmación nos hace bajar la guardia con lo que coincide con nuestras ideas. La lectura crítica exige el mismo estándar para todos los textos."]
];

return {D,DS,TIP,Q};})();
Object.assign(QZ.l,{name:"Lectura crítica",ital:true,intro:"<h1>¿Lees con espíritu crítico?</h1>\n<p>20 preguntas para evaluar tu pensamiento crítico en la lectura: interpretar el sentido de un texto, analizar sus argumentos, evaluar sus fuentes y evidencias, inferir lo no dicho y reconocer la intención de quien escribe.</p>\n<p class=\"mu\">Cada pregunta parte de un fragmento breve. Recibes retroalimentación después de cada respuesta y, al final, un perfil por habilidad. Las preguntas y las opciones cambian de orden en cada intento.</p>",ok:"¡Buena lectura!",ko:"Revisemos esta lectura",title:"Tu perfil de lectura crítica",s1:"Tienes fortaleza en todas las dimensiones.",s2:"Prueba a explicar tus lecturas a otra persona para consolidarlas.",LV:s=>{const lv=s>=17?["Lector crítico avanzado","Interpretas con precisión, detectas falacias y distingues lo dicho de lo sugerido. Tu reto es mantener ese rigor con textos más largos, densos o afines a tus ideas."]:s>=13?["Lector crítico competente","Lees bien en la mayoría de los casos, aunque a veces aceptas supuestos o saltos causales sin cuestionarlos. Fortalecer las dimensiones más bajas te llevará al nivel avanzado."]:s>=9?["Lectura crítica en desarrollo","Comprendes el sentido general, pero te cuesta cuestionar fuentes, supuestos o intenciones. La práctica deliberada en las dimensiones señaladas te hará avanzar rápido."]:["Lectura crítica inicial","Es un buen punto de partida: ahora sabes en qué preguntar más al leer. Revisa la retroalimentación y vuelve a intentarlo."]; return lv;}});
QZ.c=(()=>{
const D={I:"Interpretación y representación",F:"Formulación y modelación",E:"Ejecución y verificación",A:"Argumentación y validación"};
const DS={I:"Pensamiento crítico asociado: interpretar. Leer tablas, gráficas, escalas y enunciados y traducirlos a otra representación sin perder su significado.",F:"Pensamiento crítico asociado: analizar. Identificar datos e incógnitas y plantear el modelo adecuado a una situación.",E:"Pensamiento crítico asociado: autorregularse. Operar con exactitud y comprobar que el resultado tiene sentido.",A:"Pensamiento crítico asociado: evaluar y explicar. Justificar afirmaciones, refutar con contraejemplos y juzgar la validez de una conclusión."};
const TIP={I:"Antes de calcular, describe con tus palabras qué representa cada dato y pasa el enunciado a una tabla, ecuación o gráfica.",F:"Escribe qué se conoce, qué se pide y qué relación los une; luego elige el modelo (ecuación, sistema, razón, conteo).",E:"Estima el orden de magnitud primero y sustituye siempre tu resultado en el enunciado original.",A:"Pregúntate si tu razón vale para todos los casos o solo para uno; busca un contraejemplo y cuestiona cómo se comparan los datos."};
/* [competencia, contexto, pregunta, opciones (la correcta va primero), retroalimentación] */
const Q=[
["I","Consumo de agua de una familia:\nenero: 12 m³ · febrero: 15 m³ · marzo: 18 m³ · abril: 21 m³","Si m es el número del mes (enero = 1), ¿qué expresión modela el consumo C?",["C = 9 + 3m","C = 12m","C = 3m","C = 12 + 3m"],"El consumo crece 3 m³ cada mes. Con C = 9 + 3m: m = 1 da 12 y m = 2 da 15. Con C = 12 + 3m, enero daría 15, que no coincide con la tabla."],
["I","En un mapa a escala 1 : 50 000, dos veredas aparecen separadas por 6 cm.","¿Cuál es la distancia real entre ellas?",["3 km","300 m","30 km","6 km"],"6 cm × 50 000 = 300 000 cm = 3 000 m = 3 km. Verificar la unidad final evita errores de factor 10 o 100."],
["I","En un gráfico circular, el sector de transporte ocupa un ángulo de 54°.","¿Qué porcentaje del total representa?",["15 %","54 %","5,4 %","30 %"],"La circunferencia completa mide 360°: 54/360 = 0,15 = 15 %. Confundir grados con porcentaje es un error de interpretación."],
["I","Una recta pasa por los puntos (0, 4) y (2, 0).","¿Cuál es su pendiente y qué significa?",["−2: por cada unidad que aumenta x, y disminuye 2","2: por cada unidad que aumenta x, y aumenta 2","−4: y disminuye 4 por cada unidad de x","4: la recta corta el eje y en 4"],"Pendiente = (0 − 4)/(2 − 0) = −2. El signo negativo indica que la recta desciende; el valor 4 es la ordenada en el origen, no la pendiente."],
["I","Un taxi cobra $5 000 de banderazo más $1 200 por kilómetro. Tienes $20 000.","¿Qué inecuación representa la distancia d (en km) que puedes recorrer?",["5 000 + 1 200d ≤ 20 000","1 200d ≤ 20 000","5 000d + 1 200 ≤ 20 000","5 000 + 1 200d ≥ 20 000"],"El costo total es 5 000 + 1 200d y no puede superar lo que tienes (≤). Resolviendo, d ≤ 12,5 km."],
["F","Inviertes $1 000 000 a una tasa del 2 % mensual compuesta.","¿Cuánto dinero tendrás al cabo de 2 meses?",["$1 040 400","$1 040 000","$1 020 000","$1 400 000"],"Con interés compuesto: 1 000 000 × 1,02² = 1 040 400. Los $1 040 000 corresponden a interés simple, que ignora el interés sobre el interés."],
["F","Una llave llena un tanque en 6 horas y otra lo llena en 3 horas.","¿En cuánto tiempo lo llenan trabajando juntas?",["2 horas","4,5 horas","9 horas","3 horas"],"En una hora llenan 1/6 + 1/3 = 1/2 del tanque, así que tardan 2 horas. Promediar los tiempos es un error común: el resultado debe ser menor que el de la llave más rápida."],
["F","En una cafetería, 2 tintos y 1 pan cuestan $7 000. Un tinto y 2 panes cuestan $8 000.","¿Cuánto cuesta un tinto?",["$2 000","$3 000","$2 500","$1 500"],"Con t y p: 2t + p = 7 000 y t + 2p = 8 000. De la primera, p = 7 000 − 2t; sustituyendo, t = 2 000 y p = 3 000. Comprueba: 2(2 000) + 3 000 = 7 000."],
["F","Una clave de 3 dígitos usa dígitos distintos tomados del 1 al 5, y el orden importa.","¿Cuántas claves distintas existen?",["60","125","10","15"],"Hay 5 · 4 · 3 = 60 claves. 125 sería con repetición (5³) y 10 sería si el orden no importara (combinaciones)."],
["F","Con 40 m de malla se cercará un corral rectangular.","¿Qué dimensiones dan el área máxima?",["10 m × 10 m","5 m × 15 m","8 m × 12 m","4 m × 16 m"],"Todas las opciones tienen perímetro 40 m, pero sus áreas son 100, 75, 96 y 64 m². Con perímetro fijo, el rectángulo de mayor área es el cuadrado."],
["E","","Resuelve: 3(x − 2) = 2x + 5",["x = 11","x = 1","x = 7","x = −11"],"3x − 6 = 2x + 5 → x = 11. Verificación: 3(11 − 2) = 27 y 2(11) + 5 = 27."],
["E","","¿Cuál es el valor aproximado de 49,8 × 0,52?",["25,9","2,59","259","24"],"Estimando: 50 × 0,5 = 25. El valor exacto es 25,896. Una estimación previa permite descartar de inmediato 2,59 y 259 por su orden de magnitud."],
["E","","Calcula: (3/4) ÷ (3/8)",["2","9/32","1/2","9/8"],"Dividir es multiplicar por el inverso: 3/4 × 8/3 = 24/12 = 2. Comprobación: 2 × 3/8 = 3/4."],
["E","","Calcula: (2³)² ÷ 2⁴",["4","2","16","8"],"(2³)² = 2⁶ = 64 y 2⁴ = 16, luego 64 ÷ 16 = 4. También: 2⁶ ÷ 2⁴ = 2²."],
["E","Un estudiante resolvió x² = 9 y escribió: “x = 3”.","¿Qué verificación revela que su solución está incompleta?",["Sustituir x = −3: también cumple, por lo que las soluciones son x = 3 y x = −3","Ninguna: x = 3 es la única solución","Elevar 9 al cuadrado","Dividir 9 entre 3"],"Verificar no es solo comprobar que lo hallado sirve, sino preguntarse si faltan soluciones: (−3)² = 9 también."],
["A","","¿Cuál es la mejor justificación de que la suma de dos números impares siempre es par?",["(2a + 1) + (2b + 1) = 2(a + b + 1), que es múltiplo de 2","3 + 5 = 8 y 1 + 7 = 8, ambos pares","Lo dice el libro de texto","La calculadora da par para 9 + 11"],"Una demostración usa variables para cubrir todos los casos. Los ejemplos concretos no prueban una afirmación general."],
["A","Un estudiante afirma que 1/3 + 1/4 = 2/7, porque suma numeradores y denominadores.","¿Qué argumento muestra que es incorrecto sin hacer toda la suma?",["Que 2/7 ≈ 0,29 es menor que 1/3 ≈ 0,33; una suma de positivos no puede ser menor que uno de sus sumandos","Que 7 es un número primo","Que el resultado no está simplificado","Que no usó calculadora"],"La suma de dos fracciones positivas debe superar a cada una. El resultado correcto es 7/12. Este razonamiento de plausibilidad evalúa la respuesta sin recalcular."],
["A","El Hospital A tiene una tasa de supervivencia del 90 % y el Hospital B del 85 %. Un titular concluye que A es mejor.","¿Qué pregunta es la más importante antes de aceptar esa conclusión?",["¿Los pacientes de ambos hospitales tienen una gravedad comparable?","¿Cuál hospital es más grande?","¿Cuál tiene mejor edificio?","¿Cuál aparece primero en la lista?"],"Una tasa solo es comparable si las poblaciones lo son. Si B recibe los casos más graves, su tasa puede ser menor aun siendo igual o más eficaz."],
["A","Dos estudiantes resuelven un problema sobre la edad de Ana y obtienen 12 y 15 años.","¿Cómo se decide cuál respuesta es correcta?",["Sustituyendo cada valor en las condiciones del enunciado","Eligiendo la más cercana al promedio de ambas","Preguntando a la mayoría del curso","Eligiendo la que tenga el procedimiento más largo"],"La validez de una solución se verifica contra el problema, no contra la opinión ni la extensión del procedimiento."],
["A","","Si x > y, ¿es siempre cierto que x² > y²?",["No: con x = 1 y y = −2 se cumple x > y, pero x² = 1 < 4 = y²","Sí, porque elevar al cuadrado conserva el orden","Sí, si ambos son enteros","No, nunca se cumple"],"Un solo contraejemplo refuta una afirmación general. La desigualdad se conserva al elevar al cuadrado solo cuando ambos números no son negativos."]
];

return {D,DS,TIP,Q};})();
Object.assign(QZ.c,{name:"Competencias matemáticas",ital:false,intro:"<h1>Competencias matemáticas bajo la lupa</h1>\n<p>20 preguntas para evaluar cuatro competencias matemáticas y el pensamiento crítico que cada una pone en juego: interpretar y representar, formular y modelar, ejecutar y verificar, argumentar y validar.</p>\n<p class=\"mu\">Puedes usar lápiz y papel; no necesitas calculadora. Recibes retroalimentación después de cada respuesta y, al final, un perfil por competencia con su habilidad crítica asociada. Las preguntas y las opciones cambian de orden en cada intento.</p>",ok:"¡Razonamiento sólido!",ko:"Revisemos este razonamiento",title:"Tu perfil de competencias matemáticas",s1:"Tienes fortaleza en todas las competencias.",s2:"Prueba a explicar tus soluciones a otra persona para consolidarlas.",LV:s=>{const lv=s>=17?["Competencia matemática crítica avanzada","Interpretas, modelas, calculas y justificas con rigor, y compruebas que tus resultados tengan sentido. Tu reto es sostener ese nivel en problemas abiertos y poco estructurados."]:s>=13?["Competencia matemática crítica satisfactoria","Resuelves bien la mayoría de las situaciones, aunque a veces aceptas un resultado sin verificarlo o una afirmación sin ponerla a prueba. Fortalecer las competencias más bajas te llevará al nivel avanzado."]:s>=9?["Competencia matemática crítica en desarrollo","Dominas procedimientos básicos, pero te cuesta traducir situaciones a modelos o justificar y validar resultados. La práctica deliberada en las competencias señaladas te hará avanzar rápido."]:["Competencia matemática crítica inicial","Es un buen punto de partida: ahora sabes qué competencias reforzar. Revisa la retroalimentación y vuelve a intentarlo."]; return lv;}});
QZ.p=(()=>{
const D={C:"Comprender el problema",P:"Planificar estrategias",E:"Ejecutar y monitorear",V:"Verificar y evaluar",R:"Reflexionar y transferir"};
const DS={C:"Pensamiento crítico asociado: interpretar. Distinguir incógnitas, condiciones, datos útiles y datos que faltan o sobran.",P:"Pensamiento crítico asociado: analizar e inferir. Elegir y justificar una estrategia (trabajar hacia atrás, buscar patrones, descomponer, cambiar de enfoque).",E:"Pensamiento crítico asociado: autorregularse. Ejecutar el plan con exactitud, vigilar el avance y cambiar de rumbo cuando no funciona.",V:"Pensamiento crítico asociado: evaluar. Comprobar que la solución es razonable, cumple las condiciones y tiene sentido en el contexto.",R:"Pensamiento crítico asociado: metacognición. Aprender del error y reconocer la estructura común entre problemas distintos."};
const TIP={C:"Antes de resolver, reformula el problema con tus palabras, subraya lo que se pide y tacha los datos que no usas.",P:"Ten un repertorio de estrategias: trabajar hacia atrás, simplificar con casos pequeños, hacer un esquema, buscar patrones.",E:"Fija puntos de control: si en unos minutos no avanzas, detente, explica por qué y prueba otro camino.",V:"Comprueba tu solución con una estimación, con otro método y contra el contexto (¿tiene sentido que sean 3,25 buses?).",R:"Al terminar, anota qué estrategia funcionó, dónde dudaste y con qué otros problemas se parece."};
/* [momento, contexto, pregunta, opciones (la correcta va primero), retroalimentación] */
const Q=[
["C","En una finca hay gallinas y conejos. En total se cuentan 35 cabezas y 94 patas.","¿Cuáles son las incógnitas y las condiciones del problema?",["Incógnitas: cuántas gallinas y cuántos conejos hay. Condiciones: suman 35 animales y 94 patas","Incógnitas: 35 y 94. Condiciones: ninguna","Incógnita: el total de patas. Condición: hay 35 animales","Incógnita: la edad de los animales. Condición: hay 94 gallinas"],"Comprender es separar lo que se busca (cantidad de cada animal) de lo que se impone (35 cabezas y 94 patas). Las cifras dadas son datos, no incógnitas."],
["C","Un bus sale de Medellín a las 6:00 a. m. con 40 pasajeros, recorre 120 km a 60 km/h y es de color azul.","Si se pregunta cuánto dura el recorrido, ¿qué datos son irrelevantes?",["La hora de salida, el número de pasajeros y el color","La distancia y la velocidad","Solo el color","Ninguno: todos los datos siempre se usan"],"La duración depende de la distancia y la velocidad: 120 ÷ 60 = 2 horas. Saber descartar datos distractores es parte de comprender."],
["C","Una receta para 4 personas usa 300 g de arroz. Se pregunta: “¿Cuánto arroz necesito para la fiesta?”.","¿Qué problema tiene el enunciado?",["Falta un dato clave: cuántas personas asistirán","Sobra el dato de los 300 g","Es imposible calcular proporciones","No tiene ningún problema"],"Sin el número de invitados no hay solución única. Detectar datos que faltan evita cálculos sin sentido."],
["C","“El precio de un artículo sube un 10 % y luego baja un 10 %. ¿Es el precio final igual al inicial?”","¿Qué es lo más útil para comprender el problema antes de generalizar?",["Probar con un valor concreto, por ejemplo $100: sube a $110 y baja a $99","Suponer que sí, porque +10 y −10 se cancelan","Calcular el promedio de los dos porcentajes","Ignorar el problema por ser engañoso"],"Un caso particular hace visible la estructura: los porcentajes se aplican sobre bases distintas, así que el precio final (99) no iguala al inicial (100)."],
["P","Piensas un número, lo multiplicas por 3, le restas 4 y obtienes 17.","¿Qué estrategia permite hallar el número con mayor eficiencia?",["Trabajar hacia atrás: 17 + 4 = 21 y 21 ÷ 3 = 7","Probar números al azar hasta acertar","Sumar 3 + 4 + 17","Multiplicar 17 por 3"],"Cuando se conoce el resultado y las operaciones, invertirlas en orden inverso es directo. Comprobación: 7 × 3 − 4 = 17."],
["P","Afuera de un cuarto hay 3 interruptores y adentro una sola bombilla. Puedes entrar una sola vez para ver la bombilla.","¿Qué idea de solución permite identificar cuál interruptor la enciende?",["Usar otra variable: encender uno un rato, apagarlo, encender otro y entrar; la bombilla caliente y apagada es la del primero","Probar los interruptores al azar mientras estás adentro","Encender los tres a la vez","Es imposible resolverlo"],"El problema parece insoluble si solo se observa la luz. Pensar con flexibilidad (usar el calor como información adicional) abre una vía nueva."],
["P","Debes calcular cuántas baldosas cuadradas de 30 cm cubren un piso con forma de L, formado por dos rectángulos.","¿Cuál es el mejor plan?",["Dividir la L en dos rectángulos, calcular cada área y sumar","Multiplicar el lado más largo por el más ancho de la figura","Usar solo el perímetro","Medir al azar un lado y estimar"],"Descomponer un problema complejo en partes simples es una estrategia poderosa. Multiplicar los lados mayores sobrestimaría el área al incluir el hueco de la L."],
["P","Quieres saber cuántos apretones de manos hay si 10 personas se saludan todas entre sí una sola vez.","¿Qué estrategia es más útil?",["Resolver con 2, 3, 4 personas, buscar el patrón y generalizar","Multiplicar 10 × 10","Suponer que cada persona saluda a las 10","Contar a ojo en una reunión"],"Con 2, 3, 4 y 5 personas hay 1, 3, 6 y 10 apretones: el patrón es n(n − 1)/2, que para 10 da 45. Multiplicar 10 × 10 cuenta cada saludo dos veces y las personas con ellas mismas."],
["P","Debes hallar dos números enteros consecutivos cuyo producto sea 156.","¿Cuál es un plan razonable?",["Estimar con √156 ≈ 12 y probar 12 × 13","Probar todos los números del 1 al 1 000 sin criterio","Dividir 156 entre 2","Sumar 156 + 1"],"Si el producto es 156, los números están cerca de su raíz cuadrada (≈ 12). 12 × 13 = 156. Una estimación inteligente reduce mucho la búsqueda."],
["E","En la finca hay 35 cabezas y 94 patas, entre gallinas (2 patas) y conejos (4 patas).","¿Cuántos conejos hay?",["12","23","11","35"],"Si los 35 fueran gallinas habría 70 patas; sobran 24, y cada conejo aporta 2 patas más: 24 ÷ 2 = 12 conejos y 23 gallinas. Comprobación: 46 + 48 = 94."],

["E","Llevas 20 minutos intentando un problema con la misma estrategia, sin avanzar.","¿Qué haces?",["Me detengo, evalúo por qué no avanza y pruebo otra estrategia o un caso más simple","Repito lo mismo con más fuerza","Lo abandono para siempre","Copio una respuesta sin revisarla"],"Monitorear el propio avance y cambiar de estrategia es la esencia de la autorregulación. Insistir sin evaluar rara vez funciona."],
["E","Un ciclista recorre 30 km a 15 km/h y luego otros 30 km a 30 km/h.","¿Cuál es su velocidad media en todo el trayecto?",["20 km/h","22,5 km/h","25 km/h","30 km/h"],"Tarda 2 h + 1 h = 3 h para 60 km, es decir, 20 km/h. Promediar 15 y 30 ignora que pasa más tiempo en el tramo lento."],
["V","Calculas el área de un salón de 6 m × 8 m y obtienes 480 m².","¿Qué revisión detecta el error?",["Estimar: 6 × 8 ≈ 50, así que 480 es diez veces mayor; el resultado correcto es 48 m²","Ninguna: el resultado es correcto","Cambiar los metros por centímetros","Sumar 6 + 8"],"Una estimación de orden de magnitud permite detectar un error de factor 10 sin repetir todo el cálculo."],

Object.assign(QZ.p,{name:"Solución de problemas",ital:false,intro:"<h1>¿Cómo resuelves problemas?</h1>\n<p>20 preguntas para evaluar tu pensamiento crítico en la solución de problemas, siguiendo sus cinco momentos: comprender el problema, planificar estrategias, ejecutar y monitorear, verificar y evaluar, y reflexionar para transferir lo aprendido.</p>\n<p class=\"mu\">Puedes usar lápiz y papel; no necesitas calculadora. Recibes retroalimentación después de cada respuesta y, al final, un perfil por momento con su habilidad crítica asociada. Las preguntas y las opciones cambian de orden en cada intento.</p>",ok:"¡Buena estrategia!",ko:"Revisemos esta estrategia",title:"Tu perfil de solución de problemas",s1:"Tienes fortaleza en todos los momentos del proceso.",s2:"Prueba a explicar tus soluciones a otra persona para consolidarlas.",LV:s=>{const lv=s>=17?["Solucionador crítico avanzado","Comprendes con precisión, eliges estrategias con criterio, vigilas tu avance y verificas tus resultados. Tu reto es sostener ese nivel en problemas abiertos y sin una estructura conocida."]:s>=13?["Solucionador crítico competente","Resuelves bien la mayoría de los problemas, aunque a veces te saltas la verificación o insistes en una estrategia que no funciona. Fortalecer los momentos más bajos te llevará al nivel avanzado."]:s>=9?["Solucionador crítico en desarrollo","Tienes recursos para resolver problemas, pero te cuesta planificar, comprobar o cambiar de enfoque. La práctica deliberada en los momentos señalados te hará avanzar rápido."]:["Solucionador crítico inicial","Es un buen punto de partida: ahora sabes en qué momentos del proceso reforzar tu trabajo. Revisa la retroalimentación y vuelve a intentarlo."]; return lv;}});

let Z,K,qs,i,ans,done;const last={};
const $=id=>document.getElementById(id);
const sh=a=>{a=a.slice();for(let j=a.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a};
const show=id=>["sel","intro","quiz","res"].forEach(s=>$(s).classList.toggle("hide",s!==id));
function theme(k){document.documentElement.dataset.q=k||"";document.body.className=k?"bg-"+k:""}
function home(){K=null;theme("");$("cards").innerHTML=Object.keys(QZ).map(k=>{const z=QZ[k];return '<button class="card" data-q="'+k+'" onclick="choose(\''+k+'\')"><b>'+z.name+'</b><span class="mu">'+Object.values(z.D).join(" · ")+'</span><span class="mu">20 preguntas'+(last[k]!=null?' · último resultado: '+last[k]+'/20':'')+'</span></button>'}).join("");show("sel");window.scrollTo(0,0)}
function choose(k){K=k;Z=QZ[k];theme(k);$("introBody").innerHTML=Z.intro;show("intro");window.scrollTo(0,0)}
function start(){qs=sh(Z.Q.map(q=>q.length===4?[q[0],"",q[1],q[2],q[3]]:q)).map(q=>({d:q[0],t:q[1],q:q[2],o:sh(q[3].map((t,n)=>({t,ok:n===0}))),f:q[4]}));i=0;ans=[];show("quiz");render();window.scrollTo(0,0)}
function render(){
  const q=qs[i];done=false;
  $("cnt").textContent="Pregunta "+(i+1)+" de "+qs.length;
  $("pts").textContent="Aciertos: "+ans.filter(Boolean).length;
  $("pb").style.width=(i/qs.length*100)+"%";
  $("dim").textContent=Z.D[q.d];
  $("tx").textContent=q.t;$("tx").classList.toggle("hide",!q.t);$("tx").classList.toggle("it",!!Z.ital);
  $("q").textContent=q.q;
  $("opts").innerHTML=q.o.map((o,k)=>'<button class="opt" onclick="pick('+k+')">'+o.t+'</button>').join("");
  $("fb").className="fb hide";$("nx").classList.add("hide");
}
function pick(k){
  if(done)return;done=true;
  const q=qs[i],ok=q.o[k].ok;ans.push(ok);
  [...$("opts").children].forEach((b,n)=>{b.disabled=true;if(q.o[n].ok)b.classList.add("ok");else if(n===k)b.classList.add("ko")});
  $("fb").className="fb "+(ok?"ok":"ko");
  $("fb").innerHTML="<b>"+(ok?Z.ok:Z.ko)+"</b>"+q.f;
  $("pts").textContent="Aciertos: "+ans.filter(Boolean).length;
  $("nx").textContent=i===qs.length-1?"Ver mis resultados":"Siguiente";
  $("nx").classList.remove("hide");$("nx").focus();
}
function next(){i++;if(i<qs.length)render();else finish();window.scrollTo(0,0)}
function finish(){
  const D=Z.D,DS=Z.DS,TIP=Z.TIP;
  const tot={},ok={};qs.forEach((q,n)=>{tot[q.d]=(tot[q.d]||0)+1;ok[q.d]=(ok[q.d]||0)+(ans[n]?1:0)});
  const s=ans.filter(Boolean).length;last[K]=s;
  const lv=Z.LV(s),keys=Object.keys(D);
  const dims=keys.map(k=>{const p=Math.round(ok[k]/tot[k]*100),st=p>=75?"Fortaleza":p>=50?"En desarrollo":"Por fortalecer";
    return '<div class="dim"><div class="row"><span><b>'+D[k]+'</b> <span class="mu">— '+st+'</span></span><span>'+ok[k]+'/'+tot[k]+'</span></div><div class="bar"><i style="width:'+p+'%"></i></div><div class="mu" style="font-size:.88rem;margin-top:3px">'+DS[k]+'</div></div>'}).join("");
  const weak=keys.filter(k=>ok[k]/tot[k]<0.75).map(k=>"<li><b>"+D[k]+":</b> "+TIP[k]+"</li>").join("");
  const miss=qs.map((q,n)=>ans[n]?"":'<div class="rev">'+(q.t?'<i class="mu" style="white-space:pre-line">'+q.t+'</i><br>':'')+'<b>'+q.q+'</b><br><span style="color:var(--ok)">Respuesta correcta: '+q.o.find(o=>o.ok).t+'</span><br><span class="mu">'+q.f+'</span></div>').join("");
  $("res").innerHTML='<h2>'+Z.title+'</h2><div class="big">'+s+'<span class="mu" style="font-size:1.4rem"> / 20</span></div><h2 style="margin-top:10px">'+lv[0]+'</h2><p>'+lv[1]+'</p>'+dims+
   (weak?'<h2>Cómo seguir mejorando</h2><ul>'+weak+'</ul>':'<p><b>'+Z.s1+'</b> '+Z.s2+'</p>')+
   (miss?'<h2>Preguntas para revisar</h2>'+miss:'')+'<p><button class="btn" onclick="start()">Intentar de nuevo</button><button class="btn ghost" onclick="home()">Elegir otra competencia</button></p>';
  show("res");
}
home();
</script></body></html>
