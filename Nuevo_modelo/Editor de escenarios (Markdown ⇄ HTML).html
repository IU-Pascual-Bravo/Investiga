<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editor de escenarios (Markdown ⇄ HTML)</title>
<style>
:root{--bg:#f6f5f2;--surface:#fff;--text:#1c1b19;--muted:#6b6860;--line:#dcd9d2;--accent:#1f5eff;--accent-text:#fff;--ok:#0f7a3e;--err:#b3261e;--code-bg:#fbfaf8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--surface:#1f1f1d;--text:#ecebe7;--muted:#9a978f;--line:#34332f;--accent:#6c93ff;--accent-text:#0b0b0a;--ok:#4cc27f;--err:#ff7b72;--code-bg:#191918}}
:root[data-theme="dark"]{--bg:#161615;--surface:#1f1f1d;--text:#ecebe7;--muted:#9a978f;--line:#34332f;--accent:#6c93ff;--accent-text:#0b0b0a;--ok:#4cc27f;--err:#ff7b72;--code-bg:#191918}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
h1{font-size:17px;margin:0;font-weight:650;margin-right:auto}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
button:disabled{opacity:.45;cursor:not-allowed}
#status{flex-basis:100%;font-size:13.5px;min-height:20px;color:var(--muted)}
#status.ok{color:var(--ok)}#status.err{color:var(--err)}#status.warn{color:#b26a00}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px}
section{display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.ph{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600}
.ph span{color:var(--muted);font-weight:500}
textarea{flex:1;min-height:0;width:100%;border:0;outline:0;resize:none;padding:12px;background:var(--code-bg);color:var(--text);font:13px/18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:2}
#code{white-space:pre;overflow:auto}
#md{white-space:pre-wrap}
@media (max-width:820px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
</style>
</head>
<body>
<header>
  <h1>Editor de la constante <code>scenarios</code></h1>
  <div class="btns">
    <button id="load">Cargar otro HTML</button>
    <button id="save" class="primary">Guardar cambios</button>
    <button id="dl">Descargar HTML</button>
    <button id="cp">Copiar HTML</button>
  </div>
  <div id="status" role="status"></div>
  <input type="file" id="file" accept=".html,.htm,text/html" hidden>
</header>
<main>
  <section>
    <div class="ph">Código HTML <span id="fname">solo lectura</span></div>
    <textarea id="code" readonly spellcheck="false" wrap="off" aria-label="Código HTML"></textarea>
  </section>
  <section>
    <div class="ph">scenarios en Markdown <span id="dirty"></span></div>
    <textarea id="md" spellcheck="false" aria-label="Contenido de scenarios en Markdown"></textarea>
  </section>
</main>

let html="",fname="Lectura_critica-Facione.html",dims=[],saved="";
const $=id=>document.getElementById(id);
const LH=18;

function status(t,c){const s=$("status");s.textContent=t;s.className=c||""}
function findConst(h){const m=/const\s+scenarios\s*=\s*/.exec(h);if(!m)return null;const i=m.index+m[0].length;if(h[i]!=="[")return null;let d=0,q=null;for(let p=i;p<h.length;p++){const c=h[p];if(q){if(c==="\\")p++;else if(c===q)q=null;continue}if(c==='"'||c==="'"||c==="`")q=c;else if(c==="[")d++;else if(c==="]"){d--;if(d===0){let e=p+1;if(h[e]===";")e++;return{start:m.index,end:e,literal:h.slice(i,p+1)}}}}return null}
function readDims(h){try{const m=/const\s+dimensions\s*=\s*(\[[\s\S]*?\])/.exec(h);return m?new Function("return "+m[1])():[]}catch(e){return[]}}

function toMD(arr){return arr.map((s,i)=>{let o="# "+s.title+"\n\n**Introducción:** "+s.intro+"\n\n## Estímulo\n\n"+s.stimulus+"\n";s.questions.forEach((q,n)=>{o+="\n## Pregunta "+(n+1)+"\n\n**Dimensión:** "+q.d+(dims[q.d]?" — "+dims[q.d]:"")+"\n**Enunciado:** "+q.q+"\n\n"+q.o.map(([v,l])=>"- "+v+") "+l).join("\n")+"\n\n**Correcta:** "+q.a.join(", ")+"\n"});return o}).join("\n---\n\n")}

function parseMD(md){
  const L=md.replace(/\r/g,"").split("\n"),out=[];let s=null,q=null,mode="",stim=[];
  const fail=(i,m)=>{throw new Error("Línea "+(i+1)+": "+m)};
  const endStim=()=>{if(s&&mode==="stim"){s.stimulus=stim.join("\n").trim();stim=[]}};
  L.forEach((raw,i)=>{const t=raw.trim();let m;
    if(mode==="stim"&&!/^#{1,2} /.test(t)&&!/^---+$/.test(t)){stim.push(raw);return}
    if(!t||/^---+$/.test(t))return;
    if(m=t.match(/^# (.+)$/)){endStim();s={title:m[1].trim(),intro:"",stimulus:"",questions:[]};out.push(s);q=null;mode="s";return}
    if(!s)fail(i,"el contenido debe iniciar con un título «# Escenario…»");
    if(/^## Est[ií]mulo/i.test(t)){endStim();mode="stim";q=null;return}
    if(/^## Pregunta/i.test(t)){endStim();q={d:null,q:"",o:[],a:[]};s.questions.push(q);mode="q";return}
    if(m=t.match(/^\*\*Introducci[oó]n:\*\*\s*(.*)$/)){s.intro=m[1];return}
    if(!q)fail(i,"texto fuera de una pregunta o del estímulo");
    if(m=t.match(/^\*\*Dimensi[oó]n:\*\*\s*(\d+)/)){q.d=+m[1];return}
    if(m=t.match(/^\*\*Enunciado:\*\*\s*(.*)$/)){q.q=m[1];return}
    if(m=t.match(/^[-*]\s+([A-Za-z])\)\s*(.*)$/)){q.o.push([m[1].toUpperCase(),m[2]]);return}
    if(m=t.match(/^\*\*Correcta:\*\*\s*(.*)$/)){q.a=m[1].toUpperCase().split(/[^A-Z]+/).filter(Boolean);return}
    fail(i,"línea no reconocida: «"+t.slice(0,40)+"»");
  });
  endStim();
  if(!out.length)throw new Error("No se encontró ningún escenario.");
  out.forEach((s,a)=>{const w="Escenario "+(a+1)+": ";
    if(!s.stimulus)throw new Error(w+"falta el estímulo.");
    if(!s.questions.length)throw new Error(w+"no tiene preguntas.");
    s.questions.forEach((q,n)=>{const p=w+"pregunta "+(n+1)+": ";
      if(q.d===null||(dims.length&&q.d>=dims.length))throw new Error(p+"dimensión inválida (0 a "+Math.max(dims.length-1,0)+").");
      if(!q.q)throw new Error(p+"falta el enunciado.");
      if(q.o.length<2)throw new Error(p+"se requieren al menos 2 opciones.");
      const ls=q.o.map(x=>x[0]);if(new Set(ls).size!==ls.length)throw new Error(p+"letras de opción repetidas.");
      if(!q.a.length||q.a.some(x=>!ls.includes(x)))throw new Error(p+"la(s) respuesta(s) correcta(s) deben coincidir con las opciones.")})});
  return out}

const js=s=>JSON.stringify(s).replace(/<\/script/gi,"<\\/script");
function toJS(a){return "const scenarios=[\n"+a.map(s=>" {title:"+js(s.title)+",intro:"+js(s.intro)+",stimulus:"+js(s.stimulus)+",questions:["+"\n"+s.questions.map(q=>"  {d:"+q.d+",q:"+js(q.q)+",o:["+q.o.map(([v,l])=>"["+js(v)+","+js(l)+"]").join(",")+"],a:["+q.a.map(js).join(",")+"]}").join(",\n")+"]}").join(",\n")+"\n];"}

function showCode(hl){$("code").value=html;$("fname").textContent=fname;const r=findConst(html);if(!r)return;const line=html.slice(0,r.start).split("\n").length-1;const c=$("code");c.scrollTop=Math.max(0,line*LH-LH*2);if(hl){c.focus({preventScroll:true});c.setSelectionRange(r.start,r.end);c.scrollTop=Math.max(0,line*LH-LH*2)}}
function init(h,name){html=h;fname=name||fname;dims=readDims(h);const r=findConst(h);showCode(false);
  if(!r){$("md").value="";status("No se encontró la constante «scenarios» en este archivo.","err");return}
  try{const arr=new Function("return "+r.literal)();$("md").value=saved=toMD(arr);dirty();
    const nq=arr.map(s=>s.questions.length);
    status("Archivo cargado: "+arr.length+" escenarios ("+nq.join(" + ")+" preguntas).","ok")}
  catch(e){$("md").value="";status("No se pudo interpretar «scenarios»: "+e.message,"err")}}
function dirty(){const d=$("md").value!==saved;$("dirty").textContent=d?"cambios sin guardar":"";$("dl").disabled=d;$("cp").disabled=d}

function save(){
  const r=findConst(html);if(!r){status("No se encontró la constante «scenarios».","err");return}
  let arr;try{arr=parseMD($("md").value)}catch(e){status(e.message,"err");return}
  html=html.slice(0,r.start)+toJS(arr)+html.slice(r.end);saved=$("md").value;dirty();showCode(true);
  const odd=arr.length!==5||arr.some(s=>s.questions.length!==3);
  status(odd?"Guardado. Aviso: el cuestionario original está diseñado para 5 escenarios de 3 preguntas; otros números pueden romper el avance y el puntaje.":"Cambios guardados en el código. Ya puedes descargar el HTML.",odd?"warn":"ok")}
async function download(){
  try{
    if(typeof claude==="undefined"||!claude.use)throw{code:"unavailable",message:"las descargas no están disponibles en esta vista"};
    const d=await claude.use("downloads");
    if(!d)throw{code:"unavailable",message:"las descargas no están disponibles en esta vista"};
    await d.save({filename:fname,data:html});
    status("Archivo enviado a descarga.","ok")
  }catch(e){
    if(e&&e.code==="declined")status("Descarga cancelada.");
    else status("No se pudo descargar ("+((e&&e.code)||"error")+": "+((e&&e.message)||e)+"). Usa «Copiar HTML» y pégalo en un archivo .html.","err")}}
async function copyHtml(){
  try{await navigator.clipboard.writeText(html);status("HTML copiado al portapapeles. Pégalo en un archivo con extensión .html.","ok")}
  catch(e){const c=$("code");c.focus();c.select();let ok=false;try{ok=document.execCommand("copy")}catch(_){}
    status(ok?"HTML copiado al portapapeles.":"No se pudo copiar automáticamente: el código quedó seleccionado en el panel izquierdo; cópialo con Ctrl/Cmd+C.",ok?"ok":"warn")}}

$("save").onclick=save;$("dl").onclick=download;$("cp").onclick=copyHtml;$("md").oninput=dirty;
$("load").onclick=()=>$("file").click();
$("file").onchange=async e=>{const f=e.target.files[0];if(!f)return;init(await f.text(),f.name);e.target.value=""};
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();save()}});
init(new TextDecoder().decode(Uint8Array.from(atob(B64),c=>c.charCodeAt(0))));
